esphome:
  name: yourname
  friendly_name: yourname
  min_version: 2025.5.0
  name_add_mac_suffix: false 


substitutions:
  wifi_ssid: "yourname"
  wifi_password: "yourpass"
  api_key: "yourkey"
  
  serving_time: "1000"
  base_period: "100"
  jerk_duration: "170"
  jerk_interval: "150"
  min_interval_sec: "5"
  window_10m_sec: "600"
  window_24h_sec: "86400"
  max_10m: "2"
  max_24h: "6"

esp32:
  board: esp32dev
  framework:
    type: esp-idf

wifi:
  ssid: ${wifi_ssid}
  password: ${wifi_password}

logger:
  level: DEBUG

api:
  encryption:
    key: ${api_key}

ota:
  platform: esphome

time:
  - platform: homeassistant
    id: ha_time

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO4
      mode: INPUT_PULLUP
      inverted: true
    id: feed_button_hw
    name: "Feed Button"
    filters:
      - delayed_on: 30ms
    on_press:
      - script.execute: feed_if_allowed

  - platform: gpio
    pin:
      number: GPIO17
      mode: INPUT_PULLUP
      inverted: true
    id: plus_button_hw
    internal: true
    filters:
      - delayed_on: 30ms
    on_press:
      - number.increment: serving_time

  - platform: gpio
    pin:
      number: GPIO18
      mode: INPUT_PULLUP
      inverted: true
    id: minus_button_hw
    internal: true
    filters:
      - delayed_on: 30ms
    on_press:
      - number.decrement: serving_time

button:
  - platform: template
    name: "Feed Button"
    id: feed_button
    on_press:
      - script.execute: feed_if_allowed

  - platform: template
    name: "Reset Food Weight"
    on_press:
      - script.execute: reset_food_weight

  - platform: template
    name: "Increase Portion"
    icon: "mdi:plus-circle-outline"
    on_press:
      - number.increment: serving_time

  - platform: template
    name: "Decrease Portion"
    icon: "mdi:minus-circle-outline"
    on_press:
      - number.decrement: serving_time

output:
  - platform: ledc
    id: servo_pwm
    pin: GPIO14
    frequency: 50 Hz

servo:
  - id: feeder_servo
    output: servo_pwm
    auto_detach_time: 5s
    min_level: 3%
    idle_level: 7.5%
    max_level: 12%

number:
  - platform: template
    id: serving_time
    name: "Portion time, ms"
    min_value: 100
    max_value: 4000
    step: 100
    initial_value: ${serving_time}
    restore_value: true
    optimistic: true

  - platform: template
    id: jerk_period
    name: "Jerk period, ms"
    min_value: 100
    max_value: 5000
    step: 50
    initial_value: ${base_period}
    restore_value: true
    optimistic: true

  - platform: template
    id: jerk_duration
    name: "Jerk duration, ms"
    min_value: 50
    max_value: 500
    step: 10
    initial_value: ${jerk_duration}
    restore_value: true
    optimistic: true

  - platform: template
    id: jerk_interval
    name: "Jerk interval, ms"
    min_value: 50
    max_value: 500
    step: 10
    initial_value: ${jerk_interval}
    restore_value: true
    optimistic: true

  - platform: template
    id: feed_limit_10m
    name: "Max feedings per 10 min"
    icon: "mdi:counter"
    entity_category: config
    mode: slider
    min_value: 1
    max_value: 20
    step: 1
    initial_value: ${max_10m}
    restore_value: true
    optimistic: true
    on_value:
      then:
        - lambda: |-
            ESP_LOGI("feeder", "10-minute feeding limit changed to %d", (int) x);

  - platform: template
    id: feed_limit_24h
    name: "Max feedings per 24 h"
    icon: "mdi:counter"
    entity_category: config
    mode: slider
    min_value: 1
    max_value: 50
    step: 1
    initial_value: ${max_24h}
    restore_value: true
    optimistic: true
    on_value:
      then:
        - lambda: |-
            ESP_LOGI("feeder", "24-hour feeding limit changed to %d", (int) x);

  - platform: template
    id: feed_min_interval
    name: "Minimum feeding interval"
    icon: "mdi:timer-outline"
    entity_category: config
    unit_of_measurement: "s"
    mode: slider
    min_value: 5
    max_value: 300
    step: 1
    initial_value: ${min_interval_sec}
    restore_value: true
    optimistic: true
    on_value:
      then:
        - lambda: |-
            ESP_LOGI("feeder", "Minimum feeding interval changed to %d s", (int) x);
globals:
  - id: times10m
    type: int
    restore_value: true
    initial_value: '0'
  - id: times24h
    type: int
    restore_value: true
    initial_value: '0'
  - id: window10_start
    type: uint32_t
    restore_value: true
    initial_value: '0'
  - id: window24_start
    type: uint32_t
    restore_value: true
    initial_value: '0'
  - id: last_feed_sec
    type: uint32_t
    restore_value: true
    initial_value: '0'
  - id: last_food_weight
    type: float
    restore_value: true
    initial_value: '0.0'
  - id: feedings_count
    type: int
    restore_value: true
    initial_value: '0'
  - id: portion_ms
    type: int
    initial_value: '0'
  - id: forward_left_ms
    type: int
    initial_value: '0'
  - id: phase_ms
    type: int
    initial_value: '0'

script:
  - id: dispense
    mode: single
    parameters:
      ms: int
    then:
      - lambda: |-
          id(forward_left_ms) = ms;
          ESP_LOGI("feeder", "Dispense: %d ms forward budget", ms);
      - while:
          condition:
            lambda: 'return id(forward_left_ms) > 0;'
          then:
            - lambda: |-
                id(phase_ms) = std::min((int) id(jerk_period).state,
                                        id(forward_left_ms));
                id(feeder_servo).write(1.0f);
            - delay: !lambda 'return id(phase_ms);'
            - lambda: |-
                id(forward_left_ms) -= id(phase_ms);
            - if:
                condition:
                  lambda: 'return id(forward_left_ms) > 0;'
                then:
                  - servo.write:
                      id: feeder_servo
                      level: -100%
                  - delay: !lambda 'return (int) id(jerk_duration).state;'
                  - lambda: |-
                      id(phase_ms) = std::min((int) id(jerk_interval).state,
                                              id(forward_left_ms));
                      id(feeder_servo).write(1.0f);
                  - delay: !lambda 'return id(phase_ms);'
                  - lambda: |-
                      id(forward_left_ms) -= id(phase_ms);
      - servo.write:
          id: feeder_servo
          level: 0%
      - delay: 100ms
      - servo.detach: feeder_servo

      - lambda: |-
          id(last_food_weight) += ms * 14.5f / 1000.0f;
          ESP_LOGI("feeder",
                   "Dispense finished: estimated total food weight=%.1f g",
                   id(last_food_weight));

      - homeassistant.action:
          action: input_number.set_value
          data:
            entity_id: input_number.feedings_count
          data_template:
            value: "{{ count }}"
          variables:
            count: !lambda 'return id(feedings_count);'

      - homeassistant.action:
          action: input_number.set_value
          data:
            entity_id: input_number.total_food_weight
          data_template:
            value: "{{ weight }}"
          variables:
            weight: !lambda 'return id(last_food_weight);'
            
  - id: feed_if_allowed
    mode: single
    then:
      - if:
          condition:
            lambda: |-
              if (id(dispense).is_running()) {
                ESP_LOGW("feeder",
                         "Feed rejected: dispenser is already running");
                return false;
              }

              auto now = id(ha_time).now();
              if (!now.is_valid()) {
                ESP_LOGW("feeder",
                         "Feed rejected: time not synchronized with Home Assistant");
                return false;
              }

              if (isnan(id(feed_limit_10m).state) ||
                  isnan(id(feed_limit_24h).state) ||
                  isnan(id(feed_min_interval).state)) {
                ESP_LOGW("feeder",
                         "Feed rejected: limit settings are not initialized");
                return false;
              }

              const uint32_t ts = now.timestamp;

              const int limit10 = (int) id(feed_limit_10m).state;
              const int limit24 = (int) id(feed_limit_24h).state;
              const uint32_t min_interval =
                  (uint32_t) id(feed_min_interval).state;

              const uint32_t window10 =
                  (uint32_t) atoi("${window_10m_sec}");
              const uint32_t window24 =
                  (uint32_t) atoi("${window_24h_sec}");

              if (id(last_feed_sec) != 0) {
                if (ts < id(last_feed_sec)) {
                  ESP_LOGW("feeder",
                           "Feed rejected: current time is before last feeding");
                  return false;
                }

                const uint32_t elapsed = ts - id(last_feed_sec);

                if (elapsed < min_interval) {
                  ESP_LOGW("feeder",
                           "Feed rejected: minimum interval %u s, wait %u s",
                           (unsigned) min_interval,
                           (unsigned) (min_interval - elapsed));
                  return false;
                }
              }

              if ((id(window10_start) != 0 &&
                   ts < id(window10_start)) ||
                  (id(window24_start) != 0 &&
                   ts < id(window24_start))) {
                ESP_LOGW("feeder",
                         "Feed rejected: current time is before saved limit window");
                return false;
              }

              const bool in10 =
                  id(window10_start) != 0 &&
                  ts - id(window10_start) < window10;

              const bool in24 =
                  id(window24_start) != 0 &&
                  ts - id(window24_start) < window24;

              if (in10 && id(times10m) >= limit10) {
                ESP_LOGW("feeder",
                         "Feed rejected: 10-minute limit reached (%d/%d), wait %u s",
                         id(times10m), limit10,
                         (unsigned) (window10 -
                                     (ts - id(window10_start))));
                return false;
              }

              if (in24 && id(times24h) >= limit24) {
                ESP_LOGW("feeder",
                         "Feed rejected: 24-hour limit reached (%d/%d), wait %u s",
                         id(times24h), limit24,
                         (unsigned) (window24 -
                                     (ts - id(window24_start))));
                return false;
              }

              return true;

          then:
            - lambda: |-
                const uint32_t ts = id(ha_time).now().timestamp;

                if (id(window10_start) == 0 ||
                    ts - id(window10_start) >=
                        (uint32_t) atoi("${window_10m_sec}")) {
                  id(window10_start) = ts;
                  id(times10m) = 0;
                }

                if (id(window24_start) == 0 ||
                    ts - id(window24_start) >=
                        (uint32_t) atoi("${window_24h_sec}")) {
                  id(window24_start) = ts;
                  id(times24h) = 0;
                }

                id(last_feed_sec) = ts;
                id(times10m)++;
                id(times24h)++;
                id(feedings_count)++;
                id(portion_ms) = (int) id(serving_time).state;

                ESP_LOGI("feeder",
                         "Feed allowed: portion=%d ms, 10min=%d/%d, 24h=%d/%d",
                         id(portion_ms),
                         id(times10m), (int) id(feed_limit_10m).state,
                         id(times24h), (int) id(feed_limit_24h).state);

            - script.execute:
                id: dispense
                ms: !lambda 'return id(portion_ms);'
  
  - id: reset_food_weight
    mode: single
    then:
      - lambda: |-
          id(last_food_weight) = 0.0f;
          id(feedings_count) = 0;
      - homeassistant.action:
          action: input_number.set_value
          data:
            entity_id: input_number.total_food_weight
            value: '0'
      - homeassistant.action:
          action: input_number.set_value
          data:
            entity_id: input_number.feedings_count
            value: '0'
